server:
  port: 8087

spring:
  application:
    name: CREDIT-RISK-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5432/credit_risk_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info